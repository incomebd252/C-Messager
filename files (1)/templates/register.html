{% extends "base.html" %}
{% block title %}Create Account · C-Messager{% endblock %}
{% block content %}
<main class="auth">
  <div class="panel">
    <div class="brand"><div class="logo">C</div><h1>C-Messager</h1></div>
    <p class="sub">Create a new account. After registration, you will get an ID No to chat with others.</p>
    {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
    <form method="post" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">

      <label for="name">Full Name</label>
      <input id="name" name="name" required minlength="2" maxlength="80" value="{{ f.get('name', '') }}">

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="2" required maxlength="250">{{ f.get('address', '') }}</textarea>

      <div class="row2">
        <div>
          <label for="birthday">Date of Birth</label>
          <input id="birthday" type="date" name="birthday" required value="{{ f.get('birthday', '') }}">
        </div>
        <div>
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" inputmode="tel" required maxlength="20" value="{{ f.get('phone', '') }}">
        </div>
      </div>

      <label for="email">Email (optional)</label>
      <input id="email" type="email" name="email" maxlength="120" value="{{ f.get('email', '') }}">

      <div class="row2">
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" name="password" required minlength="6" autocomplete="new-password">
        </div>
        <div>
          <label for="confirm">Confirm Password</label>
          <input id="confirm" type="password" name="confirm" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <label class="check">
        <input type="checkbox" name="agree" value="1" required>
        <span>I have read and agree to the <a href="{{ url_for('privacy') }}" target="_blank" rel="noopener">Privacy Policy</a>.</span>
      </label>

      <button class="full" type="submit">Create Account</button>
    </form>
    <p class="note">Already have an account? <a href="{{ url_for('login') }}">Log In</a></p>
  </div>
</main>
{% endblock %}
