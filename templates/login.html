{% extends "base.html" %}
{% block title %}Log In · C-Messager{% endblock %}
{% block content %}
<main class="auth">
  <div class="panel">
    <div class="brand"><div class="logo">C</div><h1>C-Messager</h1></div>
    <p class="sub">Log in using your ID No and Password.</p>
    {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="code">ID No (e.g., CM1001)</label>
      <input id="code" name="code" required autocapitalize="characters" value="{{ code or '' }}">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">
      <button class="full" type="submit">Log In</button>
    </form>
    <p class="note">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    <p class="note">Forgot password? Contact an admin for a temporary password.</p>
  </div>
</main>
{% endblock %}
