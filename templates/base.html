<!doctype html>
<html lang="en">
<head>
<meta name="description" content="C-Messager is an online real-time chatting platform. Log in with your ID No and password to start messaging.">
<meta name="keywords" content="C-Messager, c-messager, c messager, online chat app, render chat app">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="google-site-verification" content="P6VeJlZFw5aR1WYwq-Fkz15X1b8RfhnM6fukdWOe07s" />
<title>{% block title %}C-Messager{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body data-csrf="{{ csrf_token() }}" {% block bodydata %}{% endblock %}>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% if msgs %}
  <div class="flash-wrap" role="status">
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  </div>
  {% endif %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
