{% extends "base.html" %}
{% block title %}C-Messager{% endblock %}
{% block bodydata %}data-me="{{ me.user_code }}"{% endblock %}
{% block content %}
<div class="app" id="app">
  <aside class="side">
    <div class="me">
      <img class="av" src="{{ url_for('avatar', code=me.user_code) }}?v={{ me.avatar or 0 }}" alt="">
      <div class="me-text">
        <div class="name">{{ me.name }}</div>
        <span class="badge">ID: {{ me.user_code }}</span>
      </div>
      <div class="me-actions">
        <button type="button" class="icon" id="themeBtn" title="Dark / Light" aria-label="Dark or Light theme">&#9680;</button>
        <a class="icon" href="{{ url_for('profile') }}" title="My Profile" aria-label="My Profile">&#9881;</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="icon" type="submit" title="Log Out" aria-label="Log Out">&#9099;</button>
        </form>
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-row">
        <input id="search" type="search" placeholder="Search by ID No or Name" autocomplete="off" aria-label="Search by ID No or Name">
        <button type="button" class="ghost" id="newGroupBtn">+ Group</button>
      </div>
      <div id="results" class="results" hidden></div>
    </div>

    <div class="convs" id="convs"></div>
  </aside>

  <section class="main">
    <div class="head" id="head" hidden>
      <button type="button" class="icon back" id="backBtn" aria-label="Go Back">&larr;</button>
      <div class="head-info" id="headInfo"></div>
      <button type="button" class="ghost" id="infoBtn" hidden>Group Info</button>
    </div>

    <div class="msgs" id="msgs">
      <div class="placeholder">Select a chat from the left, or start a new chat using an ID.</div>
    </div>

    <form class="compose" id="composer" hidden autocomplete="off">
      <div class="chip" id="chip" hidden>
        <span id="chipName"></span>
        <button type="button" id="chipX" aria-label="Remove Image">&times;</button>
      </div>
      <div class="compose-row">
        <input type="file" id="file" accept="image/*" hidden>
        <button type="button" class="icon big" id="attach" aria-label="Attach Image" title="Send Image">&#128206;</button>
        <input id="text" maxlength="2000" placeholder="Type a message" aria-label="Message">
        <button type="submit" id="sendBtn">Send</button>
      </div>
    </form>
  </section>
</div>

<dialog id="groupDlg" aria-labelledby="gTitle">
  <form id="groupForm" class="dlg">
    <h2 id="gTitle">New Group</h2>
    <label for="gName">Group Name</label>
    <input id="gName" required maxlength="60">
    <label for="gMembers">Member ID Numbers (separated by commas)</label>
    <input id="gMembers" placeholder="CM1002, CM1005" autocomplete="off">
    <p class="err" id="groupErr" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="ghost" id="groupCancel">Cancel</button>
      <button type="submit">Create Group</button>
    </div>
  </form>
</dialog>

<dialog id="infoDlg" aria-labelledby="infoTitle">
  <div class="dlg">
    <h2 id="infoTitle"></h2>
    <ul class="members" id="memberList"></ul>
    <form id="addRow" class="add-row" hidden>
      <input id="addCode" placeholder="New member ID No" aria-label="New member ID No" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p class="err" id="infoErr" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="ghost danger" id="leaveBtn">Leave Group</button>
      <button type="button" class="ghost" id="infoClose">Close</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="{{ url_for('static', filename='chat.js') }}"></script>
{% endblock %}
