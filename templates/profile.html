{% extends "base.html" %}
{% block title %}My Profile · C-Messager{% endblock %}
{% block content %}
<main class="page">
  <a href="{{ url_for('chat') }}" class="back">&larr; Back to Chat</a>

  <section class="panel wide">
    <h1>My Profile</h1>
    <div class="idbox small"><b>{{ me.user_code }}</b><span>Your ID No (share with friends)</span></div>

    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="info">

      <div class="avatar-edit">
        <img class="av xl" src="{{ url_for('avatar', code=me.user_code) }}?v={{ me.avatar or 0 }}" alt="Your profile picture">
        <div>
          <label for="avatar">Profile Picture (png / jpg / webp)</label>
          <input type="file" id="avatar" name="avatar" accept="image/*">
          <label class="check"><input type="checkbox" name="remove_avatar" value="1"><span>Remove picture</span></label>
        </div>
      </div>

      <label for="name">Full Name</label>
      <input id="name" name="name" required minlength="2" maxlength="80" value="{{ me.name }}">

      <label for="bio">Bio (short description)</label>
      <input id="bio" name="bio" maxlength="200" value="{{ me.bio or '' }}">

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="2" required maxlength="250">{{ me.address }}</textarea>

      <div class="row2">
        <div>
          <label for="birthday">Date of Birth</label>
          <input id="birthday" type="date" name="birthday" required value="{{ me.birthday }}">
        </div>
        <div>
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" inputmode="tel" required maxlength="20" value="{{ me.phone }}">
        </div>
      </div>

      <label for="email">Email</label>
      <input id="email" type="email" name="email" maxlength="120" value="{{ me.email or '' }}">

      <button class="full" type="submit">Save Changes</button>
    </form>
  </section>

  <section class="panel wide">
    <h2>Change Password</h2>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="password">
      <label for="current">Current Password</label>
      <input id="current" type="password" name="current" required autocomplete="current-password">
      <div class="row2">
        <div>
          <label for="new">New Password</label>
          <input id="new" type="password" name="new" required minlength="6" autocomplete="new-password">
        </div>
        <div>
          <label for="confirm">Confirm New Password</label>
          <input id="confirm" type="password" name="confirm" required minlength="6" autocomplete="new-password">
        </div>
      </div>
      <button class="full" type="submit">Change Password</button>
    </form>
  </section>
</main>
{% endblock %}
